<!DOCTYPE html><html lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport"><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}
@keyframes shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
.shimmer-text {
  background-size: 200% auto;
  animation: shimmer 6s linear infinite;
}
#page-loader {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 1rem;
  background: #050608;
  color: #f8fbff;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}
#page-loader.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
#page-loader .loader {
  width: 72px;
  height: 72px;
  position: relative;
  perspective: 800px;
}
#page-loader .loader .inner {
  position: absolute;
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  border-radius: 50%;
}
#page-loader .loader .one {
  border-bottom: 3px solid #efeffa;
  animation: rotate-one 1s linear infinite;
}
#page-loader .loader .two {
  border-right: 3px solid #efeffa;
  animation: rotate-two 1s linear infinite;
}
#page-loader .loader .three {
  border-top: 3px solid #efeffa;
  animation: rotate-three 1s linear infinite;
}
#page-loader .loader-text {
  font-family: 'Instrument Sans', sans-serif;
  font-size: 0.95rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #dfe6ff;
}
@keyframes rotate-one {
  0% { transform: rotateX(35deg) rotateY(-45deg) rotateZ(0deg); }
  100% { transform: rotateX(35deg) rotateY(-45deg) rotateZ(360deg); }
}
@keyframes rotate-two {
  0% { transform: rotateX(50deg) rotateY(10deg) rotateZ(0deg); }
  100% { transform: rotateX(50deg) rotateY(10deg) rotateZ(360deg); }
}
@keyframes rotate-three {
  0% { transform: rotateX(35deg) rotateY(55deg) rotateZ(0deg); }
  100% { transform: rotateX(35deg) rotateY(55deg) rotateZ(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
@media (max-width: 768px) {
  [class*="blur-[120px]"], [class*="blur-[100px]"] { filter: blur(48px) !important; }
  [class*="blur-[60px]"] { filter: blur(24px) !important; }
  .backdrop-blur-xl, .backdrop-blur-2xl, .backdrop-blur-md { backdrop-filter: blur(8px) !important; -webkit-backdrop-filter: blur(8px) !important; }
}
